<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Часы МСК</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    height: 100%;
    width: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    box-sizing: border-box;
  }
  svg {
    width: min(92vmin, 560px);
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <svg id="clock" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Минутные деления (тонкие, светло-серые) -->
    <g id="ticks-min" stroke="#bbb" stroke-width="0.4" stroke-linecap="round"></g>
    <!-- Часовые деления (короткие, чёрные) -->
    <g id="ticks-hour" stroke="#222" stroke-width="0.9" stroke-linecap="round"></g>

    <!-- Стрелки -->
    <line id="hour-hand"   x1="0" y1="0" x2="0" y2="-44" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
    <line id="minute-hand" x1="0" y1="0" x2="0" y2="-72" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
    <line id="second-hand" x1="0" y1="6" x2="0" y2="-78" stroke="#000" stroke-width="0.6" stroke-linecap="round"/>

    <!-- Центральная точка -->
    <circle cx="0" cy="0" r="3.2" fill="#000"/>
  </svg>

<script>
(function () {
  // Build tick marks once.
  var minG = document.getElementById('ticks-min');
  var hourG = document.getElementById('ticks-hour');
  var minHTML = '';
  var hourHTML = '';
  for (var i = 0; i < 60; i++) {
    var angle = i * 6; // degrees
    if (i % 5 === 0) {
      // Hour tick: from r=82 to r=92
      hourHTML += '<line x1="0" y1="-82" x2="0" y2="-92" transform="rotate(' + angle + ')"/>';
    } else {
      // Minute tick: from r=87 to r=92
      minHTML += '<line x1="0" y1="-87" x2="0" y2="-92" transform="rotate(' + angle + ')"/>';
    }
  }
  minG.innerHTML = minHTML;
  hourG.innerHTML = hourHTML;

  function moscowTime() {
    var fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Moscow',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    });
    var parts = {};
    fmt.formatToParts(new Date()).forEach(function (p) {
      if (p.type !== 'literal') parts[p.type] = p.value;
    });
    // Sub-second precision via host clock (MSK has no DST so offset is stable).
    var ms = new Date().getMilliseconds();
    return {
      h: +parts.hour % 24,
      m: +parts.minute,
      s: +parts.second,
      ms: ms
    };
  }

  var hourEl = document.getElementById('hour-hand');
  var minEl = document.getElementById('minute-hand');
  var secEl = document.getElementById('second-hand');

  function tick() {
    var t = moscowTime();
    var secAngle = (t.s + t.ms / 1000) * 6;       // 360 / 60
    var minAngle = (t.m + t.s / 60) * 6;          // smooth minute hand
    var hourAngle = ((t.h % 12) + t.m / 60) * 30; // 360 / 12

    secEl.setAttribute('transform', 'rotate(' + secAngle + ')');
    minEl.setAttribute('transform', 'rotate(' + minAngle + ')');
    hourEl.setAttribute('transform', 'rotate(' + hourAngle + ')');
  }

  tick();
  // Smooth animation via requestAnimationFrame — second hand glides like the reference.
  function loop() {
    tick();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

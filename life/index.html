<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жизнь</title>
<style>
  :root {
    --bg: #fff;
    --ink: #111;
    --fade: #d9d9d9;
    --muted: #9a9a9a;
    --line: #e6e6e6;
  }
  /* Theme follows the system automatically — no switch to press. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;   /* matches Notion's dark page background */
      --ink: #e9e9e9;
      --fade: #3a3a3a;
      --muted: #7d7d7d;
      --line: #2c2c2c;
    }
  }
  /* ?theme=light / ?theme=dark still wins, in case the system and Notion disagree. */
  html[data-theme="light"] {
    --bg: #fff; --ink: #111; --fade: #d9d9d9; --muted: #9a9a9a; --line: #e6e6e6;
  }
  html[data-theme="dark"] {
    --bg: #191919; --ink: #e9e9e9; --fade: #3a3a3a; --muted: #7d7d7d; --line: #2c2c2c;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .wrap {
    width: 100%;
    /* Capped so the widget stays a small rectangle even in a full-width block. */
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Both grids share one row, sized 80:30 — so a dot is the same size in each
     and the 30-year strip reads as a slice of the 80-year one. */
  .rows {
    display: grid;
    grid-template-columns: 80fr 30fr;
    gap: 16px;
    align-items: start;
  }
  section { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
  }
  .label {
    font-size: 9px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .pct {
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .note {
    font-size: 9px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---------- dot grids, laid on their side ----------
     A column is one year of life, a row is one week of that year: 52 rows tall
     instead of 80, which keeps the whole widget wide and short. */
  .grid {
    display: grid;
    grid-template-rows: repeat(52, 1fr);
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 1px;
    width: 100%;
  }
  .g80 { aspect-ratio: 80 / 52; }
  .g30 { aspect-ratio: 30 / 52; }
  .dot {
    border-radius: 50%;
    background: var(--fade);
  }
  .dot.lived { background: var(--ink); }
  .dot.now {
    background: var(--ink);
    outline: 1px solid var(--ink);
    outline-offset: 1px;
  }

  /* ---------- days counter ---------- */
  .counter {
    display: flex;
    align-items: baseline;
    gap: 10px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
    flex-wrap: wrap;
  }
  .big {
    font-size: 22px;
    line-height: 1;
    font-weight: 300;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 420px) {
    .label, .note { font-size: 8px; }
    .big { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="rows">
      <section>
        <div class="head">
          <span class="label">80 лет</span>
          <span class="pct" id="pct80"></span>
        </div>
        <div class="grid g80" id="grid80"></div>
        <div class="note" id="note80"></div>
      </section>

      <section>
        <div class="head">
          <span class="label">30 лет</span>
          <span class="pct" id="pct30"></span>
        </div>
        <div class="grid g30" id="grid30"></div>
        <div class="note" id="note30"></div>
      </section>
    </div>

    <div class="counter">
      <span class="label">с 1 ноября 2021</span>
      <span class="big" id="daysBig"></span>
      <span class="note" id="daysNote"></span>
    </div>
  </div>

<script>
(function () {
  // ---------- constants ----------
  var BORN = { y: 2005, m: 11, d: 8 };   // 8 ноября 2005
  var SINCE = { y: 2021, m: 11, d: 1 };  // 1 ноября 2021
  var DAY = 86400000;
  var ROWS = 52;                          // one column of dots = one year of life

  // UTC anchors avoid any DST/timezone drift in the day arithmetic.
  function utc(o) { return Date.UTC(o.y, o.m - 1, o.d); }

  // Current Moscow date, read via Intl so the host timezone doesn't matter.
  function moscowToday() {
    var fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Moscow',
      year: 'numeric', month: '2-digit', day: '2-digit'
    });
    var p = {};
    fmt.formatToParts(new Date()).forEach(function (x) {
      if (x.type !== 'literal') p[x.type] = x.value;
    });
    return Date.UTC(+p.year, +p.month - 1, +p.day);
  }

  // Russian plural: 1 день / 2 дня / 5 дней
  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100;
    var b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function nbsp(n) {
    // Thin space as a thousands separator — keeps big numbers readable.
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  // ---------- grid rendering ----------
  // Dots are emitted in week order; grid-auto-flow: column fills them
  // top-to-bottom, year by year.
  function buildGrid(el, years, weeksLived) {
    var total = years * ROWS;
    var html = '';
    for (var i = 0; i < total; i++) {
      var cls = 'dot';
      if (i < weeksLived) cls += ' lived';
      else if (i === weeksLived) cls += ' now';
      html += '<div class="' + cls + '"></div>';
    }
    el.innerHTML = html;
  }

  var lastWeeks = -1;

  function render() {
    var today = moscowToday();

    // One column = one year of life, so a week's position is counted from the
    // last birthday rather than straight from birth. Keeps every column exactly
    // 52 dots while the percentage still matches the real calendar to two decimals.
    var age = new Date(today).getUTCFullYear() - BORN.y;
    if (today < Date.UTC(new Date(today).getUTCFullYear(), BORN.m - 1, BORN.d)) age--;
    var lastBirthday = Date.UTC(BORN.y + age, BORN.m - 1, BORN.d);
    var weeksLived = age * ROWS + Math.floor((today - lastBirthday) / DAY / 7);

    var total80 = 80 * ROWS;
    var total30 = 30 * ROWS;

    // Redraw the dot grids only when a new week has actually started.
    if (weeksLived !== lastWeeks) {
      buildGrid(document.getElementById('grid80'), 80, weeksLived);
      buildGrid(document.getElementById('grid30'), 30, weeksLived);
      lastWeeks = weeksLived;
    }

    document.getElementById('pct80').textContent = (weeksLived / total80 * 100).toFixed(2) + '%';
    document.getElementById('pct30').textContent = (weeksLived / total30 * 100).toFixed(2) + '%';

    document.getElementById('note80').textContent =
      nbsp(weeksLived) + ' из ' + nbsp(total80) + ' недель';
    document.getElementById('note30').textContent =
      nbsp(weeksLived) + ' из ' + nbsp(total30);

    // ---------- days since 1 Nov 2021 ----------
    var sinceDays = Math.floor((today - utc(SINCE)) / DAY);
    document.getElementById('daysBig').textContent =
      nbsp(sinceDays) + ' ' + plural(sinceDays, 'день', 'дня', 'дней');
    var sinceWeeks = Math.floor(sinceDays / 7);
    document.getElementById('daysNote').textContent =
      nbsp(sinceWeeks) + ' ' + plural(sinceWeeks, 'неделя', 'недели', 'недель') +
      ' · ' + (sinceDays / 365.2425).toFixed(2) + ' года';
  }

  // Optional override: ?theme=dark / ?theme=light. Otherwise the CSS media query decides.
  var forced = (location.search.match(/[?&]theme=(dark|light)/) || [])[1];
  if (forced) document.documentElement.setAttribute('data-theme', forced);

  render();
  // A week or a day only turns over once — a minute of granularity is plenty.
  setInterval(render, 60000);
})();
</script>
</body>
</html>

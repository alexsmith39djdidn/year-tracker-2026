<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year tracker</title>
<style>
  :root {
    --ink: #000;
    --paper: #fff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: stretch;
  }
  .row {
    display: grid;
    width: 100%;
  }
  .days {
    grid-template-columns: repeat(53, 1fr);
    grid-auto-rows: 1fr;
    aspect-ratio: 53 / 7;
    gap: 2px;
  }
  .weeks {
    grid-template-columns: repeat(52, 1fr);
    aspect-ratio: 52 / 1;
    gap: 2px;
  }
  .hours {
    grid-template-columns: repeat(24, 1fr);
    aspect-ratio: 24 / 1;
    gap: 3px;
  }
  .quarters {
    grid-template-columns: repeat(4, 1fr);
    aspect-ratio: 4 / 1;
    gap: 6px;
  }
  .cell {
    background: var(--paper);
    border: 1px solid var(--ink);
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }
  .cell.empty { border: none; background: transparent; }
  .cell.past {
    background: var(--ink);
    border-color: var(--ink);
  }
  .cell.now {
    background: var(--paper);
    border: 1.5px solid var(--ink);
  }
  /* Partial-fill cells (quarters, current hour): solid border + inner fill */
  .cell.partial { background: var(--paper); }
  .cell.partial > i {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--ink);
    display: block;
  }
  .percent {
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  @media (max-width: 480px) {
    .wrap { gap: 14px; }
    .days, .weeks { gap: 1.5px; }
    .quarters { gap: 4px; }
    .hours { gap: 2px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div id="days" class="row days"></div>
    <div id="weeks" class="row weeks"></div>
    <div id="quarters" class="row quarters"></div>
    <div id="percent" class="percent"></div>
  </div>

<script>
(function () {
  function startOfDay(d) {
    var x = new Date(d);
    x.setHours(0, 0, 0, 0);
    return x;
  }

  // Get current Moscow time as a plain object {y,m,d,h,min}
  // Uses Intl to read parts in Europe/Moscow regardless of host TZ.
  function moscowNow() {
    var fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Moscow',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    });
    var parts = {};
    fmt.formatToParts(new Date()).forEach(function (p) {
      if (p.type !== 'literal') parts[p.type] = p.value;
    });
    return {
      year: +parts.year,
      month: +parts.month,   // 1..12
      day: +parts.day,       // 1..31
      hour: +parts.hour % 24,
      minute: +parts.minute,
      second: +parts.second
    };
  }

  function render() {
    var msk = moscowNow();
    var YEAR = msk.year;
    // "Today" anchored to Moscow date — used for marking past/current days.
    var today = new Date(YEAR, msk.month - 1, msk.day);
    today.setHours(0, 0, 0, 0);

    var startOfYear = new Date(YEAR, 0, 1); startOfYear.setHours(0, 0, 0, 0);
    var endOfYear = new Date(YEAR + 1, 0, 1);
    var totalDays = Math.round((endOfYear - startOfYear) / 86400000);

    // Days passed (whole days completed) + fraction of current day by MSK clock.
    var daysCompleted = Math.round((today - startOfYear) / 86400000);
    var dayFrac = (msk.hour * 3600 + msk.minute * 60 + msk.second) / 86400;
    var yearProgress = (daysCompleted + dayFrac) / totalDays;

    // ---------- DAYS GRID: 53 columns × 7 rows ----------
    var daysEl = document.getElementById('days');
    var jan1Dow = (startOfYear.getDay() + 6) % 7; // Mon=0..Sun=6
    var rows = [];
    for (var r = 0; r < 7; r++) rows.push([]);
    for (var col = 0; col < 53; col++) {
      for (var row = 0; row < 7; row++) {
        var idx = col * 7 + row - jan1Dow;
        if (idx < 0 || idx >= totalDays) {
          rows[row].push(null);
        } else {
          var d = new Date(YEAR, 0, 1 + idx); d.setHours(0, 0, 0, 0);
          var cls = '';
          if (d.getTime() < today.getTime()) cls = 'past';
          else if (d.getTime() === today.getTime()) cls = 'now';
          rows[row].push(cls);
        }
      }
    }
    var html = '';
    for (var r2 = 0; r2 < 7; r2++) {
      for (var c2 = 0; c2 < 53; c2++) {
        var info = rows[r2][c2];
        if (info === null) html += '<div class="cell empty"></div>';
        else html += '<div class="cell' + (info ? ' ' + info : '') + '"></div>';
      }
    }
    daysEl.innerHTML = html;

    // ---------- WEEKS GRID: 52 cells ----------
    var weeksEl = document.getElementById('weeks');
    var weeksHtml = '';
    for (var w = 0; w < 52; w++) {
      var ws = new Date(YEAR, 0, 1 + w * 7); ws.setHours(0, 0, 0, 0);
      var we = new Date(YEAR, 0, 1 + w * 7 + 6); we.setHours(0, 0, 0, 0);
      var wcls = '';
      if (we.getTime() < today.getTime()) wcls = 'past';
      else if (today.getTime() >= ws.getTime() && today.getTime() <= we.getTime()) wcls = 'now';
      weeksHtml += '<div class="cell' + (wcls ? ' ' + wcls : '') + '"></div>';
    }
    weeksEl.innerHTML = weeksHtml;

    // ---------- QUARTERS: 4 cells with partial fill by days ----------
    var quartersEl = document.getElementById('quarters');
    var qBoundaries = [
      [new Date(YEAR, 0, 1),  new Date(YEAR, 3, 1)],
      [new Date(YEAR, 3, 1),  new Date(YEAR, 6, 1)],
      [new Date(YEAR, 6, 1),  new Date(YEAR, 9, 1)],
      [new Date(YEAR, 9, 1),  new Date(YEAR + 1, 0, 1)]
    ];
    var qHtml = '';
    for (var q = 0; q < 4; q++) {
      var qs = qBoundaries[q][0]; qs.setHours(0,0,0,0);
      var qe = qBoundaries[q][1]; qe.setHours(0,0,0,0);
      var qTotalDays = Math.round((qe - qs) / 86400000);
      var nowMs = today.getTime() + dayFrac * 86400000;
      var passedMs = nowMs - qs.getTime();
      var frac = passedMs / (qTotalDays * 86400000);
      if (frac <= 0) {
        qHtml += '<div class="cell"></div>';
      } else if (frac >= 1) {
        qHtml += '<div class="cell past"></div>';
      } else {
        var pct = (frac * 100).toFixed(2);
        qHtml += '<div class="cell partial"><i style="height:' + pct + '%"></i></div>';
      }
    }
    quartersEl.innerHTML = qHtml;

    // ---------- HOURS: 24 cells, MSK ----------
    var hoursEl = document.getElementById('hours');
    var hoursHtml = '';
    for (var h = 0; h < 24; h++) {
      if (h < msk.hour) {
        hoursHtml += '<div class="cell past"></div>';
      } else if (h === msk.hour) {
        var minFrac = (msk.minute * 60 + msk.second) / 3600;
        var mpct = (minFrac * 100).toFixed(2);
        if (minFrac <= 0) {
          hoursHtml += '<div class="cell"></div>';
        } else {
          hoursHtml += '<div class="cell partial"><i style="height:' + mpct + '%"></i></div>';
        }
      } else {
        hoursHtml += '<div class="cell"></div>';
      }
    }
    hoursEl.innerHTML = hoursHtml;

    // ---------- PERCENT ----------
    var pctEl = document.getElementById('percent');
    pctEl.textContent = (yearProgress * 100).toFixed(2) + '% / ' + YEAR;
  }

  render();
  // Refresh every 30 seconds — keeps hours/percent live and handles year rollover automatically.
  setInterval(render, 30000);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year tracker</title>
<style>
  :root {
    --ink: #000;
    --paper: #fff;
  }
  /* Theme follows the system automatically. */
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e9e9e9;
      --paper: #191919;   /* matches Notion's dark page background */
    }
  }
  /* ?theme=light / ?theme=dark overrides it, if the system and Notion disagree. */
  html[data-theme="light"] { --ink: #000; --paper: #fff; }
  html[data-theme="dark"]  { --ink: #e9e9e9; --paper: #191919; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: stretch;
  }
  .row {
    display: grid;
    width: 100%;
  }
  .days {
    grid-template-columns: repeat(53, 1fr);
    grid-auto-rows: 1fr;
    aspect-ratio: 53 / 7;
    gap: 2px;
  }
  /* Same 53 columns as the days grid — each week sits exactly under its column. */
  .weeks {
    grid-template-columns: repeat(53, 1fr);
    aspect-ratio: 53 / 1;
    gap: 2px;
  }
  .quarters {
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  /* Each quarter is its own little grid: 13 weeks × 7 days = 91 cells, no ragged edge. */
  .quarter {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    grid-auto-rows: 1fr;
    aspect-ratio: 13 / 7;
    gap: 2px;
  }
  .cell {
    background: var(--paper);
    border: 1px solid var(--ink);
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }
  .cell.empty { border: none; background: transparent; }
  .cell.past {
    background: var(--ink);
    border-color: var(--ink);
  }
  .cell.now {
    background: var(--paper);
    border: 1.5px solid var(--ink);
  }
  /* Partial-fill cells (quarters, current hour): solid border + inner fill */
  .cell.partial { background: var(--paper); }
  .cell.partial > i {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--ink);
    display: block;
  }
  .percent {
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  @media (max-width: 480px) {
    .wrap { gap: 14px; }
    .days, .weeks, .quarter { gap: 1.5px; }
    .quarters { gap: 8px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div id="days" class="row days"></div>
    <div id="weeks" class="row weeks"></div>
    <div id="quarters" class="row quarters"></div>
    <div id="percent" class="percent"></div>
  </div>

<script>
(function () {
  // Optional override: ?theme=dark / ?theme=light. Otherwise the CSS media query decides.
  var forcedTheme = (location.search.match(/[?&]theme=(dark|light)/) || [])[1];
  if (forcedTheme) document.documentElement.setAttribute('data-theme', forcedTheme);

  function startOfDay(d) {
    var x = new Date(d);
    x.setHours(0, 0, 0, 0);
    return x;
  }

  // Get current Moscow time as a plain object {y,m,d,h,min}
  // Uses Intl to read parts in Europe/Moscow regardless of host TZ.
  function moscowNow() {
    var fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Moscow',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    });
    var parts = {};
    fmt.formatToParts(new Date()).forEach(function (p) {
      if (p.type !== 'literal') parts[p.type] = p.value;
    });
    return {
      year: +parts.year,
      month: +parts.month,   // 1..12
      day: +parts.day,       // 1..31
      hour: +parts.hour % 24,
      minute: +parts.minute,
      second: +parts.second
    };
  }

  function render() {
    var msk = moscowNow();
    var YEAR = msk.year;
    // "Today" anchored to Moscow date — used for marking past/current days.
    var today = new Date(YEAR, msk.month - 1, msk.day);
    today.setHours(0, 0, 0, 0);

    var startOfYear = new Date(YEAR, 0, 1); startOfYear.setHours(0, 0, 0, 0);
    var endOfYear = new Date(YEAR + 1, 0, 1);
    var totalDays = Math.round((endOfYear - startOfYear) / 86400000);

    // Days passed (whole days completed) + fraction of current day by MSK clock.
    var daysCompleted = Math.round((today - startOfYear) / 86400000);
    var dayFrac = (msk.hour * 3600 + msk.minute * 60 + msk.second) / 86400;
    var yearProgress = (daysCompleted + dayFrac) / totalDays;

    // ---------- DAYS GRID: 53 columns × 7 rows ----------
    var daysEl = document.getElementById('days');
    var jan1Dow = (startOfYear.getDay() + 6) % 7; // Mon=0..Sun=6
    var rows = [];
    for (var r = 0; r < 7; r++) rows.push([]);
    for (var col = 0; col < 53; col++) {
      for (var row = 0; row < 7; row++) {
        var idx = col * 7 + row - jan1Dow;
        if (idx < 0 || idx >= totalDays) {
          rows[row].push(null);
        } else {
          var d = new Date(YEAR, 0, 1 + idx); d.setHours(0, 0, 0, 0);
          var cls = '';
          if (d.getTime() < today.getTime()) cls = 'past';
          else if (d.getTime() === today.getTime()) cls = 'now';
          rows[row].push(cls);
        }
      }
    }
    var html = '';
    for (var r2 = 0; r2 < 7; r2++) {
      for (var c2 = 0; c2 < 53; c2++) {
        var info = rows[r2][c2];
        if (info === null) html += '<div class="cell empty"></div>';
        else html += '<div class="cell' + (info ? ' ' + info : '') + '"></div>';
      }
    }
    daysEl.innerHTML = html;

    // ---------- WEEKS GRID: 53 cells, one per column of the days grid ----------
    // Week w covers exactly the days shown in column w above, so the two rows line up.
    var weeksEl = document.getElementById('weeks');
    var weeksHtml = '';
    for (var w = 0; w < 53; w++) {
      // First and last columns are clipped by the year boundaries.
      var firstIdx = Math.max(0, w * 7 - jan1Dow);
      var lastIdx = Math.min(totalDays - 1, w * 7 + 6 - jan1Dow);
      if (firstIdx > lastIdx) {
        weeksHtml += '<div class="cell empty"></div>';
        continue;
      }
      var ws = new Date(YEAR, 0, 1 + firstIdx); ws.setHours(0, 0, 0, 0);
      var we = new Date(YEAR, 0, 1 + lastIdx); we.setHours(0, 0, 0, 0);
      var wcls = '';
      if (we.getTime() < today.getTime()) wcls = 'past';
      else if (today.getTime() >= ws.getTime() && today.getTime() <= we.getTime()) wcls = 'now';
      weeksHtml += '<div class="cell' + (wcls ? ' ' + wcls : '') + '"></div>';
    }
    weeksEl.innerHTML = weeksHtml;

    // ---------- QUARTERS: 4 mini grids of 13 weeks × 7 days ----------
    // A quarter runs 90–92 days, so cells map to it proportionally rather than
    // one-per-day: that keeps all four blocks perfect rectangles with no gaps,
    // at the cost of at most a single day of rounding.
    var quartersEl = document.getElementById('quarters');
    var qBoundaries = [
      [new Date(YEAR, 0, 1),  new Date(YEAR, 3, 1)],
      [new Date(YEAR, 3, 1),  new Date(YEAR, 6, 1)],
      [new Date(YEAR, 6, 1),  new Date(YEAR, 9, 1)],
      [new Date(YEAR, 9, 1),  new Date(YEAR + 1, 0, 1)]
    ];
    var qHtml = '';
    for (var q = 0; q < 4; q++) {
      var qs = qBoundaries[q][0]; qs.setHours(0,0,0,0);
      var qe = qBoundaries[q][1]; qe.setHours(0,0,0,0);
      var qTotalDays = Math.round((qe - qs) / 86400000);
      var QCELLS = 91;
      // How many cells the elapsed part of this quarter fills right now.
      var daysIntoQ = (today.getTime() - qs.getTime()) / 86400000;
      var filled = Math.round(daysIntoQ / qTotalDays * QCELLS);
      if (filled < 0) filled = 0;
      if (filled > QCELLS) filled = QCELLS;

      var cellsHtml = '';
      for (var i = 0; i < QCELLS; i++) {
        // Column-major, same reading direction as the days grid above.
        var col = Math.floor(i / 7);
        var row = i % 7;
        var idxQ = col * 7 + row;
        var qcls = '';
        if (idxQ < filled) qcls = 'past';
        else if (idxQ === filled && filled > 0) qcls = 'now';
        cellsHtml += '<div class="cell' + (qcls ? ' ' + qcls : '') + '"></div>';
      }
      qHtml += '<div class="quarter">' + cellsHtml + '</div>';
    }
    quartersEl.innerHTML = qHtml;

    // ---------- PERCENT ----------
    var pctEl = document.getElementById('percent');
    pctEl.textContent = (yearProgress * 100).toFixed(2) + '% / ' + YEAR;
  }

  render();
  // Refresh every 30 seconds — keeps hours/percent live and handles year rollover automatically.
  setInterval(render, 30000);
})();
</script>
</body>
</html>

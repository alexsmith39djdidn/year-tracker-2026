<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рейтинги по областям</title>
<link rel="stylesheet" href="../base.css">
<style>
  body { padding: 14px 16px; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .grid.one { grid-template-columns: 1fr; max-width: 560px; }

  .card { border: 1px solid var(--line); border-radius: 5px; padding: 13px 14px 12px; }

  .chead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 3px; }
  .cname { font-size: 12px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink); font-weight: 500; }
  .cscore { font-size: 30px; font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
  .czone { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 11px; }

  .gbar { height: 3px; background: var(--fade); border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
  .gbar i { display: block; height: 100%; }

  .s { margin-bottom: 9px; }
  .s:last-child { margin-bottom: 0; }
  .sline { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sname { font-size: 12.5px; }
  .sval { font-size: 15px; font-weight: 500; flex: 0 0 auto; }
  .sfact { font-size: 10px; color: var(--muted); letter-spacing: 0.02em; }
  .sbar { height: 2px; background: var(--fade); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .sbar i { display: block; height: 100%; }
  .dim .sname, .dim .sfact { color: var(--muted); }
  .stale-tag { font-size: 9px; letter-spacing: 0.1em; color: var(--muted); }

  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="cap" id="title">Рейтинги по областям</span>
    <span class="cap" id="stamp"></span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script src="../data.js"></script>
<script>
(function () {
  var m = location.search.match(/[?&]g=([a-z]+)/);
  var only = m ? m[1] : null;

  var list = RATING.groups.filter(function (g) { return !only || g.key === only; });
  var grid = document.getElementById('grid');
  if (only && list.length) grid.className = 'grid one';

  function bar(score, parent, cls) {
    var b = document.createElement('div');
    b.className = cls;
    var i = document.createElement('i');
    if (score === null) {
      i.style.width = '0%';
    } else {
      i.style.width = Math.max(score, 1.5) + '%';
      i.style.background = colorOf(score);
    }
    b.appendChild(i);
    parent.appendChild(b);
  }

  list.forEach(function (g) {
    var gs = groupScore(g);
    var card = document.createElement('div');
    card.className = 'card';

    var head = document.createElement('div');
    head.className = 'chead';
    var nm = document.createElement('div');
    nm.className = 'cname';
    nm.textContent = g.icon + '  ' + g.name;
    var sc = document.createElement('div');
    sc.className = 'cscore';
    sc.textContent = gs === null ? '—' : gs;
    sc.style.color = gs === null ? 'var(--muted)' : colorOf(gs);
    head.appendChild(nm); head.appendChild(sc);
    card.appendChild(head);

    var z = zoneOf(gs);
    var zn = document.createElement('div');
    zn.className = 'czone';
    zn.style.color = gs === null ? 'var(--muted)' : colorOf(gs);
    zn.textContent = z ? z.name : 'данных мало';
    card.appendChild(zn);

    bar(gs, card, 'gbar');

    g.scales.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 's' + (s.score === null && !s.raw ? ' dim' : '');

      var line = document.createElement('div');
      line.className = 'sline';

      var left = document.createElement('div');
      var n = document.createElement('div');
      n.className = 'sname';
      n.textContent = s.name;
      var f = document.createElement('div');
      f.className = 'sfact';
      f.textContent = s.value + (s.note ? ' · ' + s.note : '') + (s.stale ? '  ⚠ устарел' : '');
      left.appendChild(n); left.appendChild(f);

      var v = document.createElement('div');
      v.className = 'sval';
      if (s.raw) {
        v.textContent = s.value;
        v.style.color = 'var(--ink)';
        f.textContent = (s.note ? s.note : '') + (s.stale ? '  ⚠ устарел' : '');
      } else if (s.score === null) {
        v.textContent = '—';
        v.style.color = 'var(--muted)';
      } else {
        v.textContent = s.score;
        v.style.color = colorOf(s.score);
        if (s.stale) v.style.opacity = '0.55';
      }

      line.appendChild(left); line.appendChild(v);
      row.appendChild(line);
      if (!s.raw) bar(s.stale ? null : s.score, row, 'sbar');
      card.appendChild(row);
    });

    grid.appendChild(card);
  });

  if (only && list.length) document.getElementById('title').textContent = list[0].name;

  var o = overall();
  document.getElementById('stamp').textContent =
    'карта ' + RATING.version + ' · ' + RATING.date + ' · индекс ' + o.index;
})();
</script>
</body>
</html>
